name: Update RSS feed

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore article cache
        uses: actions/cache@v4
        with:
          path: cache
          key: jandan-cache-${{ github.run_id }}
          restore-keys: |
            jandan-cache-

      - name: Generate feed
        run: |
          FEED_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/feed.xml"
          python3 jandan_rss.py --out public/feed.xml --pages 2 --self-url "$FEED_URL"

      - name: Add landing page
        run: |
          mkdir -p public
          cp site/index.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
